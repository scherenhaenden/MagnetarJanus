name: Verify Android project

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37"

      - name: Verify formatting, unit tests, lint, and debug assembly
        run: ./gradlew ktlintCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PjanusVersion="$(date -u +%Y-%m-%d-%H-%M)-0$(date -u +%S)"
